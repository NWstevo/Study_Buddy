<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .frame {
      width: 390px; height: 844px; overflow: hidden; position: relative;
      background: oklch(0.24 0.055 288);
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: oklch(0.98 0.01 288);
      display: flex; flex-direction: column;
    }
    h1, .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
  </style>
</helmet>

<div class="frame">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; gap: 22px;">

    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.75 0.06 288);">Task Alarm</span>

    <div style="width: 84px; height: 84px; border-radius: 999px; background: oklch(0.32 0.06 288); display: flex; align-items: center; justify-content: center;">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="oklch(0.98 0.01 288)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: oklch(0.32 0.06 288);">
        <div style="width: 7px; height: 7px; border-radius: 999px; background: oklch(0.75 0.14 195);"></div>
        <span style="font-size: 12px; font-weight: 700; color: oklch(0.9 0.03 288);">Cell Biology</span>
      </div>
      <h1 class="display" style="margin: 0; font-size: 28px; font-weight: 800; text-align: center; line-height: 1.2;">Lab report draft</h1>
      <span style="font-size: 14px; color: oklch(0.78 0.04 288); font-weight: 500;">Was due at 16:00 today</span>
    </div>

  </div>

  <!-- Actions -->
  <div style="padding: 16px 24px calc(22px + 4px); display: flex; flex-direction: column; gap: 10px;">
    <button style="width: 100%; padding: 16px; border: none; border-radius: 15px; background: oklch(0.98 0.01 288); color: oklch(0.24 0.055 288); font-size: 15px; font-weight: 700; font-family: 'Public Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.24 0.055 288)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      Mark as complete
    </button>
    <button style="width: 100%; padding: 15px; border: 1.5px solid oklch(0.5 0.06 288); border-radius: 15px; background: oklch(0.28 0.06 288); color: oklch(0.98 0.01 288); font-size: 15px; font-weight: 700; font-family: 'Public Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.98 0.01 288)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      Carry forward to tomorrow
    </button>
    <button style="width: 100%; padding: 13px; border: none; background: none; color: oklch(0.78 0.04 288); font-size: 14px; font-weight: 600; font-family: 'Public Sans', sans-serif;">
      Reschedule alarm instead
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
