<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .frame {
      width: 390px; height: 844px; overflow: hidden; position: relative;
      background: oklch(0.98 0.012 75);
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: oklch(0.22 0.014 75);
      display: flex; flex-direction: column;
    }
    h1, .display { font-family: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif; }
    .stat-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: oklch(1 0 0); border: 1px solid oklch(0.91 0.012 75); border-radius: 14px; flex: 1; }
  </style>
</helmet>

<div class="frame">

  <!-- Header -->
  <div style="padding: 28px 20px 4px; display: flex; align-items: center; justify-content: space-between;">
    <h1 class="display" style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em;">Summary</h1>
    <div style="display: flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 999px; border: 1px solid oklch(0.89 0.012 75); background: oklch(1 0 0);">
      <span style="font-size: 12px; font-weight: 700; color: oklch(0.4 0.012 75);">This Week</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="oklch(0.4 0.012 75)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 22px;">

    <!-- Completion ring + counts -->
    <div style="display: flex; align-items: center; gap: 18px; background: oklch(1 0 0); border: 1px solid oklch(0.91 0.012 75); border-radius: 18px; padding: 18px;">
      <svg width="88" height="88" viewBox="0 0 100 100" style="flex-shrink: 0; transform: rotate(-90deg);">
        <circle cx="50" cy="50" r="42" fill="none" stroke="oklch(0.92 0.012 75)" stroke-width="10"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="oklch(0.62 0.14 155)" stroke-width="10" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="63.3"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="display" style="font-size: 30px; font-weight: 800; line-height: 1;">76%</span>
        <span style="font-size: 13px; color: oklch(0.55 0.012 75); font-weight: 500;">13 of 17 tasks completed</span>
      </div>
    </div>

    <!-- Stat tiles -->
    <div style="display: flex; gap: 10px;">
      <div class="stat-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
        <div style="width: 26px; height: 26px; border-radius: 8px; background: oklch(0.94 0.045 155); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.13 155)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <span class="display" style="font-size: 20px; font-weight: 800;">13</span>
        <span style="font-size: 11px; color: oklch(0.55 0.012 75); font-weight: 600;">Completed</span>
      </div>
      <div class="stat-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
        <div style="width: 26px; height: 26px; border-radius: 8px; background: oklch(0.94 0.045 25); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.15 25)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </div>
        <span class="display" style="font-size: 20px; font-weight: 800;">2</span>
        <span style="font-size: 11px; color: oklch(0.55 0.012 75); font-weight: 600;">Missed</span>
      </div>
      <div class="stat-row" style="flex-direction: column; align-items: flex-start; gap: 8px;">
        <div style="width: 26px; height: 26px; border-radius: 8px; background: oklch(0.94 0.05 70); display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="oklch(0.58 0.12 70)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </div>
        <span class="display" style="font-size: 20px; font-weight: 800;">2</span>
        <span style="font-size: 11px; color: oklch(0.55 0.012 75); font-weight: 600;">Carried over</span>
      </div>
    </div>

    <!-- Daily breakdown strip -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 12px; font-weight: 700; color: oklch(0.48 0.012 75); text-transform: uppercase; letter-spacing: 0.04em;">Day by day</span>
      <div style="display: flex; justify-content: space-between; align-items: flex-end; background: oklch(1 0 0); border: 1px solid oklch(0.91 0.012 75); border-radius: 14px; padding: 16px 14px 12px;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 14px; height: 44px; border-radius: 5px; background: oklch(0.62 0.14 155);"></div><span style="font-size: 10px; color: oklch(0.6 0.01 75); font-weight: 600;">M</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 14px; height: 36px; border-radius: 5px; background: oklch(0.62 0.14 155);"></div><span style="font-size: 10px; color: oklch(0.6 0.01 75); font-weight: 600;">T</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 14px; height: 26px; border-radius: 5px; background: oklch(0.72 0.14 70);"></div><span style="font-size: 10px; color: oklch(0.22 0.014 75); font-weight: 700;">W</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 14px; height: 44px; border-radius: 5px; background: oklch(0.62 0.14 155);"></div><span style="font-size: 10px; color: oklch(0.6 0.01 75); font-weight: 600;">T</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 14px; height: 18px; border-radius: 5px; background: oklch(0.58 0.17 25);"></div><span style="font-size: 10px; color: oklch(0.6 0.01 75); font-weight: 600;">F</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 14px; height: 30px; border-radius: 5px; background: oklch(0.88 0.01 75);"></div><span style="font-size: 10px; color: oklch(0.6 0.01 75); font-weight: 600;">S</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;"><div style="width: 14px; height: 30px; border-radius: 5px; background: oklch(0.88 0.01 75);"></div><span style="font-size: 10px; color: oklch(0.6 0.01 75); font-weight: 600;">S</span></div>
      </div>
    </div>

    <!-- Per-subject breakdown -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <span style="font-size: 12px; font-weight: 700; color: oklch(0.48 0.012 75); text-transform: uppercase; letter-spacing: 0.04em;">By subject</span>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <div style="width: 7px; height: 7px; border-radius: 999px; background: oklch(0.62 0.14 240);"></div>
            <span style="font-size: 13px; font-weight: 600;">Calculus II</span>
          </div>
          <span style="font-size: 12px; color: oklch(0.55 0.012 75); font-weight: 600;">6 / 7</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: oklch(0.92 0.012 75); overflow: hidden;">
          <div style="width: 86%; height: 100%; background: oklch(0.62 0.14 240); border-radius: 999px;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <div style="width: 7px; height: 7px; border-radius: 999px; background: oklch(0.62 0.14 195);"></div>
            <span style="font-size: 13px; font-weight: 600;">Cell Biology</span>
          </div>
          <span style="font-size: 12px; color: oklch(0.55 0.012 75); font-weight: 600;">4 / 6</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: oklch(0.92 0.012 75); overflow: hidden;">
          <div style="width: 66%; height: 100%; background: oklch(0.62 0.14 195); border-radius: 999px;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 7px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <div style="width: 7px; height: 7px; border-radius: 999px; background: oklch(0.62 0.14 320);"></div>
            <span style="font-size: 13px; font-weight: 600;">Literature</span>
          </div>
          <span style="font-size: 12px; color: oklch(0.55 0.012 75); font-weight: 600;">3 / 4</span>
        </div>
        <div style="height: 6px; border-radius: 999px; background: oklch(0.92 0.012 75); overflow: hidden;">
          <div style="width: 75%; height: 100%; background: oklch(0.62 0.14 320); border-radius: 999px;"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom nav -->
  <div style="padding: 10px 20px calc(20px + 4px); background: oklch(1 0 0); border-top: 1px solid oklch(0.91 0.012 75); display: flex; align-items: center; justify-content: space-around;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.01 75)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: oklch(0.62 0.01 75);">Week</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.01 75)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: oklch(0.62 0.01 75);">Subjects</span>
    </div>
    <div style="width: 60px;"></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.5 0.15 288)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      <span style="font-size: 10px; font-weight: 700; color: oklch(0.5 0.15 288);">Summary</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 60px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="oklch(0.62 0.01 75)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.92 2.92l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V19.6a2.06 2.06 0 1 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.92-2.92l.06-.06a1.7 1.7 0 0 0 .34-1.87A1.7 1.7 0 0 0 2.6 12.4H2.5a2.06 2.06 0 1 1 0-4.12h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.92-2.92l.06.06a1.7 1.7 0 0 0 1.87.34H8.6A1.7 1.7 0 0 0 9.6 1.28V.5a2.06 2.06 0 1 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.92 2.92l-.06.06a1.7 1.7 0 0 0-.34 1.87V6.6a1.7 1.7 0 0 0 1.56 1.03h.09a2.06 2.06 0 1 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></svg>
      <span style="font-size: 10px; font-weight: 600; color: oklch(0.62 0.01 75);">Settings</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
